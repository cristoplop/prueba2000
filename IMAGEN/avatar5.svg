<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="koalaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7F9CC"/>
      <stop offset="100%" stop-color="#38A3A5"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="75" fill="url(#koalaBg)" stroke="#57CC99" stroke-width="4"/>
  <!-- Big Fluffy Koala Ears -->
  <circle cx="42" cy="56" r="22" fill="#8D99AE"/>
  <circle cx="42" cy="56" r="14" fill="#EDF2F4"/>
  <circle cx="118" cy="56" r="22" fill="#8D99AE"/>
  <circle cx="118" cy="56" r="14" fill="#EDF2F4"/>
  <!-- Head -->
  <circle cx="80" cy="90" r="44" fill="#8D99AE" filter="url(#shadow)"/>
  <!-- Safari Explorer Hat (Sombrero Safari) -->
  <ellipse cx="80" cy="56" rx="42" ry="12" fill="#DDB892" stroke="#B08968" stroke-width="2"/>
  <path d="M52,56 Q80,32 108,56 Z" fill="#C59B27"/>
  <rect x="52" y="52" width="56" height="6" fill="#7F5539"/>
  <!-- Eyes -->
  <ellipse cx="62" cy="84" rx="6" ry="7" fill="#1D2A44"/>
  <circle cx="64" cy="81" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="98" cy="84" rx="6" ry="7" fill="#1D2A44"/>
  <circle cx="100" cy="81" r="2.5" fill="#FFFFFF"/>
  <!-- Signature Big Oval Nose -->
  <ellipse cx="80" cy="94" rx="13" ry="17" fill="#2B2D42"/>
  <ellipse cx="78" cy="88" rx="4" ry="6" fill="#4A4E69" opacity="0.4"/>
  <!-- Cheeks Blush -->
  <circle cx="48" cy="98" r="6" fill="#FF8FA3" opacity="0.6"/>
  <circle cx="112" cy="98" r="6" fill="#FF8FA3" opacity="0.6"/>
  <!-- Friendly Smile -->
  <path d="M72,114 Q80,120 88,114" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
</svg>
