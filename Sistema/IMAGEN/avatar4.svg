<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="owlBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="75" fill="url(#owlBg)" stroke="#00B4D8" stroke-width="4"/>
  <!-- Wizard Hat Behind (Sombrero de Mago) -->
  <polygon points="80,14 54,64 106,64" fill="#3A0CA3"/>
  <!-- Hat Brim -->
  <ellipse cx="80" cy="64" rx="38" ry="10" fill="#4361EE"/>
  <!-- Hat Stars & Ribbon -->
  <ellipse cx="80" cy="62" rx="30" ry="6" fill="#F72585"/>
  <polygon points="80,36 82,41 87,41 83,45 85,50 80,47 75,50 77,45 73,41 78,41" fill="#FFD166"/>
  <!-- Owl Body / Feathers -->
  <ellipse cx="80" cy="94" rx="44" ry="42" fill="#7F5539" filter="url(#shadow)"/>
  <!-- Belly -->
  <ellipse cx="80" cy="106" rx="28" ry="24" fill="#EDE0D4"/>
  <!-- Belly Feather Marks -->
  <path d="M72,102 Q76,106 80,102" fill="none" stroke="#B08968" stroke-width="2"/>
  <path d="M80,102 Q84,106 88,102" fill="none" stroke="#B08968" stroke-width="2"/>
  <path d="M76,112 Q80,116 84,112" fill="none" stroke="#B08968" stroke-width="2"/>
  <!-- Big Eyes Frames (Ojos Grandes de Sabio) -->
  <circle cx="62" cy="84" r="17" fill="#FFFFFF" stroke="#DDB892" stroke-width="3"/>
  <circle cx="98" cy="84" r="17" fill="#FFFFFF" stroke="#DDB892" stroke-width="3"/>
  <!-- Golden Pupils -->
  <circle cx="62" cy="84" r="10" fill="#F59E0B"/>
  <circle cx="62" cy="84" r="6" fill="#1D2A44"/>
  <circle cx="65" cy="81" r="2.5" fill="#FFFFFF"/>
  <circle cx="98" cy="84" r="10" fill="#F59E0B"/>
  <circle cx="98" cy="84" r="6" fill="#1D2A44"/>
  <circle cx="101" cy="81" r="2.5" fill="#FFFFFF"/>
  <!-- Beak -->
  <polygon points="80,88 74,98 86,98" fill="#F77F00"/>
  <!-- Cheeks Blush -->
  <ellipse cx="44" cy="94" rx="5" ry="3" fill="#FF8FA3" opacity="0.6"/>
  <ellipse cx="116" cy="94" rx="5" ry="3" fill="#FF8FA3" opacity="0.6"/>
</svg>
