<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF595E"/>
      <stop offset="33%" stop-color="#FFCA3A"/>
      <stop offset="66%" stop-color="#8AC926"/>
      <stop offset="100%" stop-color="#1982C4"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Mascot icon badge -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="20" fill="#FFCA3A" filter="url(#logoShadow)"/>
    <text x="32" y="44" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="34" fill="#6A040F" text-anchor="middle">×</text>
    <polygon points="50,14 53,20 60,21 55,26 56,33 50,30 44,33 45,26 40,21 47,20" fill="#FFFFFF"/>
  </g>
  <!-- Text: Mundo Tablas -->
  <text x="86" y="40" font-family="'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="32" fill="#1D3557" filter="url(#logoShadow)">Mundo<tspan fill="#E63946">Tablas</tspan></text>
  <text x="88" y="60" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="800" font-size="13" fill="#457B9D" letter-spacing="1">4° BÁSICO • MATEMÁTICA INTERACTIVA</text>
</svg>
